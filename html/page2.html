<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
      <link rel="icon" href="../assets/icons/icon.png" type="image/png">
      <link rel="stylesheet" href="../css/pages/secondPage.css">
</head>
<body>
<header>
    <h1>Simulação de um site com baixa usabilidade</h1>
    <p>Tente preencher e enviar o formulário abaixo. Parece simples... ou não?</p>
  </header>

  <main class="moldura">

    <aside id="dicas">
      <h2>Dicas</h2>
      <ul id="listaDicas"></ul>
    </aside>

    <section class="tela-simulada">
      <h2>Formulário misterioso</h2>
      <form>
  
        <input type="text" id="nome" placeholder="Escreva seu nome">

        <input type="email" id="email" placeholder="Escreva sua idade">
        
        <h3>Selecione sua data de nascimento nos botões abaixo</h2>
        
        <div class="container-data">
          <button type="button" id="seletor-dia" class="botao-data">Dia</button>
          <button type="button" id="seletor-mes" class="botao-data">Mês</button>
          <button type="button" id="seletor-ano" class="botao-data">Ano</button>
        </div>

        <div class="container-botoes">
          <button type="submit" id="enviar" class="botao-estranho" title="Acertei">
            💾
          </button>

          <button type="button" id="editar" class="botao-estranho" title="Errei">
                          🖉
          </button>

          <button type="button" id="salvar" class="botao-estranho" title="Salvar">
                        🛈
          </button>
        </div>
      </form>

    </section>
    
    <section class="instrucoes">
      <button id="btnVoltar">Voltar</button>
      <button id="btnDicas" aria-label="Dicas">Dicas</button>
      <button id="btnProximo">Próximo</button>
    </section>
  </main>
  <script src="../js/pages/secondPage.js"></script>  
  <script src="../js/utils/navigations.js"></script>  
</body>
</html>
